<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOKI - Portal Nórdico</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --green-dark:#08120d;
    --green-medium:#163824;
    --green-light:#2c6b47;

    --gold:#d8bc74;
    --gold-soft:#f0ddb0;

    --text:#f5f5f5;
    --border:rgba(216,188,116,.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at top, rgba(63,141,98,.35), transparent 35%),
        linear-gradient(
            135deg,
            var(--green-dark),
            #0f2b1c,
            var(--green-medium)
        );

    color:var(--text);
    font-family:'Inter', sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 120px,
            rgba(216,188,116,.015) 121px
        );

    pointer-events:none;
}

#app{
    width:100%;
    max-width:1200px;
    padding:20px;
    position:relative;
    z-index:2;
}

.login-layout{
    display:grid;
    grid-template-columns:1fr 430px;
    gap:50px;
    align-items:center;
}

.loki-side{
    display:flex;
    justify-content:center;
    align-items:center;
}

.chibi-container{
    width:340px;
    height:340px;

    border-radius:50%;

    border:2px solid rgba(216,188,116,.3);

    background:
        radial-gradient(
            circle,
            rgba(216,188,116,.18),
            rgba(31,91,58,.12),
            transparent 75%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

.chibi-container::before{
    content:"✦";
    position:absolute;
    top:20px;
    color:var(--gold);
    font-size:28px;
}

.chibi-container::after{
    content:"ᚱ ᚢ ᚾ ᛖ";
    position:absolute;
    bottom:20px;

    color:rgba(216,188,116,.7);

    letter-spacing:8px;
    font-family:'Cinzel', serif;
}

.chibi-placeholder{
    text-align:center;
}

.chibi-placeholder .emoji{
    font-size:120px;
    display:block;
}

.chibi-placeholder p{
    margin-top:10px;
    color:var(--gold-soft);
}

.login-card{
    background:rgba(9,20,13,.88);

    backdrop-filter:blur(14px);

    border:1px solid var(--border);

    border-radius:24px;

    padding:40px;

    box-shadow:
        0 0 40px rgba(0,0,0,.45),
        0 0 25px rgba(31,91,58,.2);
}

.logo-title{
    font-family:'Cinzel', serif;
    text-align:center;

    color:var(--gold-soft);

    font-size:2rem;

    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    margin-bottom:35px;
    color:#cfcfcf;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:var(--gold-soft);
}

input{
    width:100%;

    padding:14px 16px;

    border-radius:12px;

    border:1px solid rgba(216,188,116,.25);

    background:#102419;

    color:white;

    font-size:15px;
}

input:focus{
    outline:none;

    border-color:var(--gold);

    box-shadow:
        0 0 15px rgba(216,188,116,.2);
}

button{
    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;
    font-weight:600;

    transition:.25s;

    background:
        linear-gradient(
            135deg,
            var(--gold-soft),
            var(--gold)
        );

}

button:hover{
    transform:translateY(-2px);
}

.secondary-btn{

    color:var(--gold-soft);

    border:1px solid rgba(216,188,116,.35);
}

.secondary-btn:hover{

.divider{

    align-items:center;
    gap:12px;

    margin:20px 0;
}

.divider::before,

    flex:1;
    height:1px;

.divider span{

.error-message{

.dashboard{

.dashboard h1{

.footer-lgpd{

    left:0;

    padding:12px 20px;

    font-size:12px;
    line-height:1.5;

}

.footer-lgpd strong{

@media(max-width:900px){

.dashboard-container{

.dashboard-subtitle{

.progress-wrapper{

.progress-bar{

.progress-fill{

.task-category{

.task-item{

.task-item input{

.task-description{

.chibi-image {

@media(max-width:768px){

</style>
</head>

<script>

async function submitRegister() {

    const nick =
        document.getElementById('register-nick').value.trim();

    const secret =
        document.getElementById('register-secret').value;

    const confirm =
        document.getElementById('register-secret-confirm').value;

    const errorDiv =
        document.getElementById('register-error');

    errorDiv.innerHTML = '';

    if (!nick || !secret || !confirm) {

        errorDiv.innerHTML = `
            <div class="error-message">
                Preencha todos os campos.
            </div>
        `;

        return;
    }

    if (secret !== confirm) {

        errorDiv.innerHTML = `
            <div class="error-message">
                As senhas não coincidem.
            </div>
        `;

        return;
    }

    try {

        const response = await fetch('/api/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nick,
                secret
            })
        });

        const data = await response.json();

        if (!response.ok) {

            errorDiv.innerHTML = `
                <div class="error-message">
                    ${data.message || 'Erro ao realizar cadastro.'}
                </div>
            `;

            return;
        }

        errorDiv.innerHTML = `
            <div style="
                margin-top:15px;
                text-align:center;
                color:#9de0b5;
            ">
                ${data.message}
            </div>
        `;

        // Limpa formulário
        document.getElementById('register-nick').value = '';
        document.getElementById('register-secret').value = '';
        document.getElementById('register-secret-confirm').value = '';

    } catch (error) {

        console.error(error);

        errorDiv.innerHTML = `
            <div class="error-message">
                Não foi possível conectar ao servidor.
            </div>
        `;
    }
}

async function login() {

    const errorDiv = document.getElementById('login-error');

    if (errorDiv) {
        errorDiv.innerHTML = '';
    }

    const nick = document.getElementById('nick')?.value.trim();
    const secret = document.getElementById('secret')?.value.trim();

    if (!nick || !secret) {

        errorDiv.innerHTML = `
            <div class="error-message">
                Informe Nick e Senha.
            </div>
        `;

        return;
    }

    try {

        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
                nick,
                secret
            })
        });

        const data = await response.json();

        if (!response.ok) {

            errorDiv.innerHTML = `
                <div class="error-message">
                    ${data.message}
                </div>
            `;

            return;
        }

        errorDiv.innerHTML = `
            <div style="
                margin-top:15px;
                text-align:center;
                color:#f0ddb0;
            ">
                Conectando ao reino...
            </div>
        `;

        setTimeout(() => {
            window.location.reload();
        }, 1000);

    } catch (error) {

        console.error(error);

        errorDiv.innerHTML = `
            <div class="error-message">
                Falha na comunicação com o servidor.
            </div>
        `;
    }
}

function updateProgress() {

    const checkboxes = document.querySelectorAll(
        '.task-item input[type="checkbox"]'
    );

    const checked = document.querySelectorAll(
        '.task-item input[type="checkbox"]:checked'
    );

    const total = checkboxes.length;
    const completed = checked.length;

    const percent = Math.round(
        (completed / total) * 100
    );

    document.getElementById(
        'progress-fill'
    ).style.width = `${percent}%`;

    document.getElementById(
        'progress-text'
    ).innerText =
        `${completed} de ${total} etapas concluídas`;

    document.getElementById(
        'progress-percent'
    ).innerText =
        `${percent}%`;

    if(percent === 100){
        renderJourneyCompleted();
    }
}

function bindChecklistEvents(){

    const checkboxes = document.querySelectorAll(
        '.task-item input[type="checkbox"]'
    );

    checkboxes.forEach(checkbox => {

        checkbox.addEventListener(
            'change',
            async function(){

                const success =
                    await saveTask(
                        this.dataset.task,
                        this.checked
                    );

                if(success){

                    updateProgress();

                } else {

                    this.checked = !this.checked;

                }

            }
        );

    });

}

async function saveTask(taskId, completed) {

    const response = await fetch(
        '/api/task',
        {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
                taskType: 'starter_journey',
                task: taskId,
                completed
            })
        }
    );

    return response.ok;
}

async function loadTasks() {

    try {

        const response = await fetch(
            '/api/task?taskType=starter_journey',
            {
                method: 'GET',
                credentials: 'include'
            }
        );

        const data = await response.json();

        if (!response.ok) {

            console.error(
                'Erro ao carregar tarefas:',
                data
            );

            return;
        }

        const tasks = data.tasks || {};

        Object.entries(tasks).forEach(
            ([taskId, completed]) => {

                const checkbox =
                    document.querySelector(
                        `[data-task="${taskId}"]`
                    );

                if (checkbox) {

                    checkbox.checked = completed;

                }

            }
        );

        updateProgress();

    } catch (error) {

        console.error(
            'Erro ao carregar tarefas:',
            error
        );

    }

}

async function checkAuth() {

    try {

        const res = await fetch('/api/check-session', {
            credentials: 'include'
        });

        console.log("status", res.status);

        const data = await res.json();

        if (data.loggedIn) {

            renderDashboard(data.nick);

        } else {

            renderLogin();

        }

    } catch {

        renderLogin();

    }
}

checkAuth();

</script>
